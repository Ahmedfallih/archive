<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أرشفة المستندات</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f6ff;--card:#fff;--tx:#1d2340;--mut:#69708f;--bd:#e2e7f7}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12152b;--card:#1e2240;--tx:#eef0ff;--mut:#a3a9cc;--bd:#32386388}}
:root[data-theme="dark"]{--bg:#12152b;--card:#1e2240;--tx:#eef0ff;--mut:#a3a9cc;--bd:#32386388}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;min-height:100vh}
header{padding:18px 16px 6px;text-align:center}
h1{margin:0;font-size:22px}
header p{margin:4px 0 0;color:var(--mut);font-size:13px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:12px 14px}
.tab{border:0;border-radius:20px;padding:14px 4px 10px;color:#fff;font:inherit;font-weight:700;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;transition:transform .15s,box-shadow .15s;box-shadow:0 3px 8px #0002;opacity:.78}
.tab .i{font-size:30px;line-height:1}
.tab:active{transform:scale(.92)}
.tab.on{opacity:1;transform:translateY(-3px) scale(1.04);box-shadow:0 8px 16px #0003}
.t1{background:linear-gradient(135deg,#ff7a45,#ff3d71)}.t2{background:linear-gradient(135deg,#3d8bff,#2cd0ff)}.t3{background:linear-gradient(135deg,#1fc16b,#8be04e)}.t4{background:linear-gradient(135deg,#9b5cff,#ff5cc8)}
main{padding:4px 14px 40px;max-width:640px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:12px}
.hide{display:none}
.big{width:100%;border:0;border-radius:18px;padding:18px;font:inherit;font-size:17px;font-weight:700;color:#fff;cursor:pointer;background:linear-gradient(135deg,#ff7a45,#ff3d71);transition:transform .15s}
.big:active{transform:scale(.97)}
.big.g{background:linear-gradient(135deg,#1fc16b,#8be04e)}.big.b{background:linear-gradient(135deg,#3d8bff,#2cd0ff)}.big.s{background:var(--bd);color:var(--tx)}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px;font-weight:700}
input[type=text],input[type=search]{width:100%;padding:13px;border-radius:14px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;font-size:16px}
input:focus{outline:0;border-color:#3d8bff}
.prev{width:100%;border-radius:14px;border:1px solid var(--bd);background:#fff;display:block}
.row{display:flex;gap:8px;margin-top:12px}.row>*{flex:1}
.note{font-size:13px;color:var(--mut);text-align:center;margin:8px 0}
.busy{text-align:center;padding:14px;font-weight:700;color:#3d8bff}
.spin{display:inline-block;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.item{display:flex;gap:12px;align-items:center;cursor:pointer}
.item img{width:64px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--bd);background:#fff}
.item b{display:block;font-size:16px}.item small{color:var(--mut);display:block;margin-top:3px}
.stat{display:flex;gap:10px}.stat div{flex:1;text-align:center;border-radius:16px;padding:12px;color:#fff;font-weight:700}
.stat span{display:block;font-size:26px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:12px 20px;border-radius:30px;font-size:14px;z-index:9;max-width:90%}
dialog{border:0;border-radius:20px;padding:14px;background:var(--card);color:var(--tx);width:min(92vw,500px)}
dialog::backdrop{background:#000a}
.gal{position:relative;margin-top:10px;background:linear-gradient(135deg,#9b5cff,#3d8bff)!important;overflow:visible}
.sig{text-align:center;padding:26px 16px calc(34px + env(safe-area-inset-bottom,0px));direction:ltr}
.sig i{display:block;width:90px;height:2px;margin:0 auto 14px;background:linear-gradient(90deg,transparent,#d4a017,transparent)}
.sig small{display:block;font-family:Georgia,"Times New Roman",serif;font-size:11px;letter-spacing:5px;text-transform:uppercase;color:var(--mut)}
.sig b{display:block;margin-top:6px;font-family:Georgia,"Times New Roman",serif;font-size:24px;font-weight:700;letter-spacing:2px;background:linear-gradient(135deg,#b8860b,#f5d76e 45%,#b8860b);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 1px 0 #0000}
.sig em{display:block;margin-top:4px;font-family:Georgia,serif;font-style:normal;font-size:15px;letter-spacing:6px;color:#d4a017}
.toast{white-space:pre-line;text-align:center;line-height:1.6}
:root{--red:#d11a2a;--navy:#1e3a8a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--red:#ff6b7a;--navy:#8fb3ff}}
:root[data-theme="dark"]{--red:#ff6b7a;--navy:#8fb3ff}
.item small.nv{color:var(--red);font-weight:700}
.item small.em{color:var(--navy);font-weight:700}
.item small.dt{color:var(--navy);font-size:12px;margin-top:4px}
.item .trash{align-self:flex-start;margin-top:4px}
.trash{border:0;background:#ffe3e8;color:#c0143c;border-radius:12px;width:40px;height:40px;font-size:18px;cursor:pointer;flex:none;transition:transform .15s}
.trash:active{transform:scale(.88)}
.trash.all{width:auto;padding:0 14px;font:inherit;font-weight:700;font-size:14px}
.bar{display:flex;justify-content:space-between;align-items:center;margin:0 4px 10px;font-weight:700}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .trash{background:#3a1f2b;color:#ff8aa5}}
:root[data-theme="dark"] .trash{background:#3a1f2b;color:#ff8aa5}

/* ===== Liquid-glass theme ===== */
body{background:linear-gradient(165deg,#e8f1fb 0%,#e3f2f4 55%,#e9f6ef 100%) fixed}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body{background:linear-gradient(165deg,#0e1830 0%,#112338 55%,#0f2a30 100%) fixed}}
:root[data-theme="dark"] body{background:linear-gradient(165deg,#0e1830 0%,#112338 55%,#0f2a30 100%) fixed}
.tabs{gap:12px}
.tab{position:relative;overflow:hidden;isolation:isolate;color:#2a2c4e;text-shadow:0 1px 0 rgba(255,255,255,.7);opacity:.9;border-radius:26px;padding:14px 4px 11px;
 background:radial-gradient(90% 70% at 25% 8%,rgba(255,255,255,.9),rgba(255,255,255,0) 60%),linear-gradient(160deg,var(--g1),var(--g2));
 box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.75),inset 0 3px 6px rgba(255,255,255,.9),inset 0 -10px 16px rgba(255,255,255,.28),0 10px 20px var(--sh);
 -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:transform .25s cubic-bezier(.3,1.6,.5,1),box-shadow .25s,opacity .2s}
.tab::before{content:"";position:absolute;z-index:-1;inset:4px 9px auto 9px;height:40%;border-radius:22px 22px 40px 40px/20px 20px 26px 26px;background:linear-gradient(rgba(255,255,255,.85),rgba(255,255,255,0))}
.tab .i{display:block;line-height:0}
.tab .i svg{width:32px;height:32px;fill:none;stroke:#2a2c4e;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 0 rgba(255,255,255,.8))}
.tab:active{transform:scale(.9,.94)}
.tab.on{opacity:1;transform:translateY(-4px) scale(1.05);box-shadow:inset 0 0 0 2px #fff,inset 0 3px 6px rgba(255,255,255,.95),inset 0 -10px 16px rgba(255,255,255,.3),0 14px 26px var(--sh),0 0 18px var(--sh)}
.tab.on::after{content:"";position:absolute;z-index:-1;top:0;bottom:0;width:38%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-18deg);animation:shine 4.5s ease-in-out infinite}
@keyframes shine{0%,55%{left:-60%}100%{left:130%}}
.t1{--g1:#ffe27a;--g2:#e8a400;--sh:rgba(232,164,0,.6)}
.t2{--g1:#9bd6ff;--g2:#2f8cff;--sh:rgba(47,140,255,.6)}
.t3{--g1:#c4f8de;--g2:#4fe0a0;--sh:rgba(30,190,125,.55)}
.t4{--g1:#d6c2ff;--g2:#8a5cff;--sh:rgba(138,92,255,.6)}
@media (prefers-reduced-motion:reduce){.tab.on::after{animation:none}.tab{transition:none}}

/* gold camera + red launching arrow */
.t1 .i svg{stroke:#5a3a00}
.t1{color:#4a3000}
.tab .i svg{overflow:visible}
.tab .i svg .arr{stroke:#e5102a;stroke-width:2.7;filter:drop-shadow(0 0 2px rgba(255,255,255,.9))}
.t3.on .arr,.t3:hover .arr{animation:launch 1.7s cubic-bezier(.45,0,.55,1) infinite}
@keyframes launch{
 0%,10%{transform:translateY(0);opacity:1}
 16%{transform:translateY(1.2px);opacity:1}
 52%{transform:translateY(-10px);opacity:0}
 66%{transform:translateY(-10px);opacity:0}
 67%{transform:translateY(3px);opacity:0}
 82%{transform:translateY(0);opacity:1}
 100%{transform:translateY(0);opacity:1}}
@media (prefers-reduced-motion:reduce){.t3.on .arr,.t3:hover .arr{animation:none}}

/* archive: papers slide into the folder on hover / focus / active */
.t4 .pp{transform:translateY(11px)}
.t4:hover .pp,.t4:focus-visible .pp,.t4.on .pp{animation:paperIn 2.6s cubic-bezier(.45,0,.55,1) infinite backwards}
.t4 .p2{animation-delay:.35s!important}
.t4 .p3{animation-delay:.7s!important}
@keyframes paperIn{
 0%{transform:translateY(-13px);opacity:0}
 8%{opacity:1}
 40%{transform:translateY(11px);opacity:1}
 100%{transform:translateY(11px);opacity:1}}
@media (prefers-reduced-motion:reduce){.t4:hover .pp,.t4:focus-visible .pp,.t4.on .pp{animation:none}}

/* camera lens: red blink every second on hover / focus / active */
.t1 .lens{fill:transparent}
.t1:hover .lens,.t1:focus-visible .lens,.t1.on:hover .lens,.t1.on .lens{animation:lensBlink 1s steps(1,end) infinite}
@keyframes lensBlink{
 0%{fill:#ff1f3d;stroke:#ff1f3d;filter:drop-shadow(0 0 3px rgba(255,31,61,.95))}
 50%{fill:transparent;stroke:#5a3a00;filter:none}
 100%{fill:transparent;stroke:#5a3a00;filter:none}}

@media (prefers-reduced-motion:reduce){.t1 .lens,.t2 .mag{animation:none!important}}

/* search: whole magnifier (lens + handle) travels in a soft circle with a slight colour shift */
.t2 .mlens{fill:transparent}
.t2:hover .mag,.t2:focus-visible .mag,.t2.on .mag{animation:magOrbit 2.4s ease-in-out infinite}
@keyframes magOrbit{
 0%{transform:translate(0,0);stroke:#2a2c4e}
 25%{transform:translate(1.8px,-1.8px);stroke:#1747b8}
 50%{transform:translate(0,-2.6px);stroke:#0d6efd}
 75%{transform:translate(-1.8px,-1.8px);stroke:#1747b8}
 100%{transform:translate(0,0);stroke:#2a2c4e}}

/* ===== Always-dark theme (independent of device setting) ===== */
:root,:root[data-theme="light"]{color-scheme:dark;--bg:#12152b;--card:#1e2240;--tx:#eef0ff;--mut:#a3a9cc;--bd:#32386388;--red:#ff6b7a;--navy:#8fb3ff}
body,:root[data-theme="light"] body{background:linear-gradient(165deg,#0e1830 0%,#112338 55%,#0f2a30 100%) fixed}
.trash,:root[data-theme="light"] .trash{background:#3a1f2b;color:#ff8aa5}
</style>
</head>
<body>
<header><h1>🗂️ أرشفة المستندات</h1><p>صوّر • استخرج • احفظ • صدّر</p></header>
<nav class="tabs">
 <button class="tab t1 on" data-v="cap"><span class="i"><svg viewBox="0 0 24 24"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle class="lens" cx="12" cy="13" r="3.6"/></svg></span>تصوير</button>
 <button class="tab t2" data-v="srch"><span class="i"><svg viewBox="0 0 24 24"><g class="mag"><circle class="mlens" cx="10.5" cy="10.5" r="6"/><path d="M15 15l5.5 5.5"/></g></svg></span>بحث</button>
 <button class="tab t3" data-v="exp"><span class="i"><svg viewBox="0 0 24 24"><g class="arr"><path d="M12 15V4M7.5 8.5L12 4l4.5 4.5"/></g><path d="M4 14v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg></span>تصدير</button>
 <button class="tab t4" data-v="all"><span class="i"><svg viewBox="0 0 24 24"><defs><clipPath id="fclip"><rect x="0" y="-12" width="24" height="22"/></clipPath></defs><path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><g clip-path="url(#fclip)" stroke-width="1.3"><g class="pp p1"><rect x="5.5" y="0" width="13" height="9" rx="1" fill="#fff"/><path d="M8 3h8M8 5.6h5"/></g><g class="pp p2"><rect x="8" y="0" width="10" height="9" rx="1" fill="#fff4c9"/><path d="M10.3 3h5.4M10.3 5.6h3.4"/></g><g class="pp p3"><rect x="6.5" y="0" width="11" height="9" rx="1" fill="#e4f1ff"/><path d="M9 3h6M9 5.6h4"/></g></g><path d="M3 10h18"/></svg></span>الأرشيف</button>
</nav>
<main>
 <section id="cap">
  <div class="card" id="capStart">
   <button class="big" id="shoot">📷 التقط صورة المستند</button>
   <button class="big gal" id="gal">🖼️ اختر من الاستوديو</button>
   <button class="big s" id="keyBtn" style="margin-top:10px;padding:10px;font-size:14px">🔑 مفتاح الذكاء الاصطناعي</button>
   <p class="note">وجّه الكاميرا على البطاقة مع ظهور اسم الموظف أسفل المستند. سيتم قص الأطراف وتحسين الصورة تلقائياً.</p>
  </div>
  <div class="card hide" id="capForm">
   <img class="prev" id="prev" alt="">
   <div id="err" class="hide" style="background:#ffe8e8;color:#a00;border-radius:12px;padding:10px;margin:8px 0;font-size:13px;direction:ltr;text-align:left;word-break:break-word"></div>
   <div class="busy hide" id="busy"><span class="spin">⏳</span> الذكاء الاصطناعي يقرأ المستند...</div>
   <label>اسم المستلم</label><input type="text" id="fName">
   <label>رقم الناخب</label><input type="text" id="fNum" inputmode="numeric">
   <label>اسم الموظف الذي سلّم البطاقة</label><input type="text" id="fEmp">
   <div class="row"><button class="big g" id="save">💾 حفظ</button><button class="big s" id="cancel">إلغاء</button></div>
  </div>
 </section>
 <section id="srch" class="hide">
  <div class="card"><input type="search" id="q" placeholder="اكتب اسم المستلم..."></div>
  <div id="sRes"></div>
 </section>
 <section id="exp" class="hide">
  <div class="card"><div class="stat"><div style="background:#3d8bff"><span id="cnt">0</span>مستند</div><div style="background:#1fc16b"><span id="cnt2">0</span>صورة</div></div></div>
  <div class="card">
   <button class="big g" id="xl">📊 ملف الإكسل</button>
   <div style="height:10px"></div>
   <button class="big b" id="zp">🖼️ ملف الصور (ZIP)</button>
   <p class="note">كل صورة باسم رقم الناخب. يُحفظ الملفان في جهازك.</p>
  </div>
 </section>
 <section id="all" class="hide"><div class="bar"><span id="aCnt"></span><button class="trash all" id="delAll">🗑️ حذف الكل</button></div><div id="aRes"></div></section>
</main>
<footer class="sig"><i></i><small>Designed by</small><b>Ahmed Fleih</b><em>2741</em></footer>
<dialog id="dlg"></dialog>
<input type="file" id="file" accept="image/*" capture="environment" class="hide">
<input type="file" id="file2" accept="image/*" class="hide">
<script>
(function(){"use strict";
const $=s=>document.querySelector(s);
let db,cur=null,sample=null,dl=null;
/* ---------- IndexedDB ---------- */
const openDb=()=>new Promise(r=>{try{const q=indexedDB.open("arch",1);q.onupgradeneeded=()=>q.result.createObjectStore("d",{keyPath:"id",autoIncrement:true});q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>r()}catch(e){r()}});
const mem=[];
const all=()=>new Promise(r=>{if(!db)return r(mem.slice());const q=db.transaction("d").objectStore("d").getAll();q.onsuccess=()=>r(q.result);q.onerror=()=>r([])});
const put=o=>new Promise(r=>{if(!db){o.id=mem.length+1;mem.push(o);return r()}const q=db.transaction("d","readwrite").objectStore("d").add(o);q.onsuccess=()=>r();q.onerror=()=>r()});
const clearAll=()=>new Promise(r=>{if(!db){mem.length=0;return r()}const q=db.transaction("d","readwrite").objectStore("d").clear();q.onsuccess=()=>r();q.onerror=()=>r()});
const del=id=>new Promise(r=>{if(!db){const i=mem.findIndex(x=>x.id==id);if(i>=0)mem.splice(i,1);return r()}const q=db.transaction("d","readwrite").objectStore("d").delete(id);q.onsuccess=()=>r()});
/* ---------- UI ---------- */
function toast(t,ms){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),ms||2600)}
const AR="٠١٢٣٤٥٦٧٨٩",toAr=s=>String(s).replace(/[0-9]/g,d=>AR[d]);
const toEn=s=>String(s).replace(/[٠-٩]/g,d=>AR.indexOf(d)).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d));
const fmt=ts=>{const d=new Date(ts),p=n=>String(n).padStart(2,"0");let h=d.getHours();const ap=h>=12?"م":"ص";h=h%12||12;return toAr(d.getFullYear()+"/"+p(d.getMonth()+1)+"/"+p(d.getDate())+"  "+h+":"+p(d.getMinutes())+" "+ap)};
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x==b));["cap","srch","exp","all"].forEach(s=>$("#"+s).classList.toggle("hide",s!=b.dataset.v));if(b.dataset.v=="exp")stats();if(b.dataset.v=="all")list("#aRes",null);if(b.dataset.v=="srch")list("#sRes",$("#q").value)});
const urlOf=b=>URL.createObjectURL(b);
async function stats(){const a=await all();$("#cnt").textContent=a.length;$("#cnt2").textContent=a.length}
async function list(sel,q){
 let a=await all();a.reverse();
 if(sel==="#aRes"){$("#aCnt").textContent="عدد المستندات: "+toAr(a.length);$("#delAll").style.display=a.length?"":"none"}q=(q||"").trim();
 if(q)a=a.filter(x=>(x.name||"").includes(q));
 const box=$(sel);box.innerHTML="";
 if(!a.length){box.innerHTML='<p class="note">'+(q?"لا توجد نتائج":"لا توجد مستندات بعد")+'</p>';return}
 a.forEach(x=>{const d=document.createElement("div");d.className="card item";
  const im=document.createElement("img");im.src=urlOf(x.img);
  const t=document.createElement("div");
  t.style.flex="1";t.style.minWidth="0";t.innerHTML='<b></b><small class="nv"></small><small class="em"></small><small class="dt"></small>';
  t.children[0].textContent=x.name||"—";t.children[1].textContent="رقم الناخب: "+(x.num||"—");t.children[2].textContent="الموظف: "+(x.emp||"—");t.children[3].textContent=x.ts?fmt(x.ts):toAr(x.date||"");
  const tb=document.createElement("button");tb.className="trash";tb.textContent="🗑️";tb.setAttribute("aria-label","حذف");
  tb.onclick=async ev=>{ev.stopPropagation();if(confirm("حذف مستند «"+(x.name||x.num||"")+"» نهائياً؟")){await del(x.id);list("#aRes",null);list("#sRes",$("#q").value);stats();toast("تم الحذف")}};
  d.append(im,t,tb);d.onclick=()=>show(x);box.append(d)});
}
$("#q").oninput=e=>list("#sRes",e.target.value);
$("#delAll").onclick=async()=>{const n=(await all()).length;if(!n)return;
 if(!confirm("⚠️ سيتم حذف كل المستندات ("+toAr(n)+") من هذا الجهاز نهائياً.\nتأكد أنك صدّرت نسخة احتياطية (📤 تصدير) قبل الحذف.\n\nهل تريد المتابعة؟"))return;
 if(!confirm("تأكيد أخير: حذف كل المستندات؟ لا يمكن التراجع."))return;
 await clearAll();list("#aRes",null);list("#sRes",$("#q").value);stats();toast("تم حذف كل المستندات")};
function show(x){
 const d=$("#dlg");d.innerHTML="";
 const im=document.createElement("img");im.className="prev";im.src=urlOf(x.img);
 const p=document.createElement("p");p.textContent=`${x.name||"—"} • ${x.num||"—"} • ${x.emp||"—"}`;
 const r=document.createElement("div");r.className="row";
 const c=document.createElement("button");c.className="big s";c.textContent="إغلاق";c.onclick=()=>d.close();
 const k=document.createElement("button");k.className="big";k.textContent="🗑️ حذف";

const onPick=async e=>{
 const f=e.target.files[0];if(!f)return;

 $("#busy").classList.remove("hide");["#fName","#fNum","#fEmp"].forEach(s=>$(s).value="");
 const bmp=await createImageBitmap(f).catch(()=>null);
 if(!bmp){toast("تعذّر فتح الصورة");reset();return}
 const sc=Math.min(1,1800/Math.max(bmp.width,bmp.height));
 const full=document.createElement("canvas");full.width=Math.round(bmp.width*sc);full.height=Math.round(bmp.height*sc);
 full.getContext("2d").drawImage(bmp,0,0,full.width,full.height);
 const box=findDoc(full);
 const out=document.createElement("canvas");out.width=box.w;out.height=box.h;
 const c=out.getContext("2d");c.filter="contrast(1.25) brightness(1.06) saturate(.85)";
 c.drawImage(full,box.x,box.y,box.w,box.h,0,0,box.w,box.h);
 const blob=await new Promise(r=>out.toBlob(r,"image/jpeg",.88));
 cur={img:blob};$("#prev").src=urlOf(blob);
 await extract(blob);
};

function findDoc(cv){ // قص تقريبي لحواف المستند: أكبر منطقة فاتحة عن الخلفية
 const w=160,h=Math.round(160*cv.height/cv.width),t=document.createElement("canvas");t.width=w;t.height=h;
 const g=t.getContext("2d");g.drawImage(cv,0,0,w,h);const d=g.getImageData(0,0,w,h).data,L=[];
 for(let i=0;i<d.length;i+=4)L.push(.3*d[i]+.59*d[i+1]+.11*d[i+2]);
 const hist=new Array(256).fill(0);L.forEach(v=>hist[v|0]++);
 let sum=0;for(let i=0;i<256;i++)sum+=i*hist[i];let sB=0,wB=0,mx=0,th=128;
 for(let i=0;i<256;i++){wB+=hist[i];if(!wB)continue;const wF=L.length-wB;if(!wF)break;sB+=i*hist[i];const m=sB/wB-(sum-sB)/wF,v=wB*wF*m*m;if(v>mx){mx=v;th=i}}
 let x0=w,y0=h,x1=0,y1=0,n=0;
 for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(L[y*w+x]>th){n++;if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
 const bw=x1-x0,bh=y1-y0;
 if(n<w*h*.15||bw<w*.4||bh<h*.4||bw*bh>w*h*.97)return{x:0,y:0,w:cv.width,h:cv.height};
 const k=cv.width/w,m=-3;
 const X=Math.max(0,(x0+m)*k),Y=Math.max(0,(y0+m)*k);
 return{x:Math.round(X),y:Math.round(Y),w:Math.round(Math.min(cv.width-X,(bw-2*m)*k)),h:Math.round(Math.min(cv.height-Y,(bh-2*m)*k))};
}
/* ---------- AI extraction ---------- */
const P="هذه استمارة تسليم بطاقات الناخبين الإلكترونية (عربي/كردي) فيها كتابة بخط اليد. استخرج بدقة: (1) اسم المستلم: الاسم المكتوب بخط اليد في حقل «اسم المستلم» أعلى الاستمارة. (2) رقم الناخب: الرقم المكتوب بخط اليد في حقل «رقم الناخب» تحديداً، وليس رقم البطاقة ولا رقم الوثيقة ولا الرقم التسلسلي الأحمر. (3) اسم الموظف: الاسم المكتوب بخط اليد بجانب «اسم موظف التسليم» أسفل الاستمارة، وليس اسم المستلم الثاني ولا التوقيع. أعد JSON فقط بهذا الشكل: {\"voter_name\":\"اسم المستلم\",\"voter_number\":\"\",\"employee_name\":\"\"}. اكتب الأسماء بالعربية، والأرقام بالإنجليزية 0-9. اترك الحقل فارغاً إن لم تكن متأكداً ولا تخمّن.";
const getKey=()=>{try{return localStorage.getItem("ak")||""}catch(e){return ""}};
async function extract(blob){
 const er=$("#err");er.classList.add("hide");er.textContent="";
 const fail=m=>{er.textContent="⚠️ "+m;er.classList.remove("hide");toast("تعذّرت القراءة، أدخل البيانات يدوياً")};
 try{
  const key=getKey();if(!key){fail("لا يوجد مفتاح. اضغط زر 🔑 والصق المفتاح ");$("#busy").classList.add("hide");return}
  const b64=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(",")[1]);f.readAsDataURL(blob)});
  let t="";
  try{
   if(key.startsWith("sk-ant")){
    const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:400,messages:[{role:"user",content:[{type:"image",source:{type:"base64",media_type:"image/jpeg",data:b64}},{type:"text",text:P}]}]})});
    const j=await res.json().catch(()=>({}));
    if(!res.ok){fail("خطأ "+res.status+": "+((j.error&&j.error.message)||"غير معروف"));$("#busy").classList.add("hide");return}
    t=j.content.map(c=>c.text||"").join("");
   }else{
    let dyn=[];
    try{const lr=await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=200&key="+encodeURIComponent(key));const lj=await lr.json();
     dyn=(lj.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent")&&/flash/.test(m.name)&&!/image|tts|live|audio|thinking|exp|preview|robotics|computer/.test(m.name)).map(m=>m.name.replace("models/","")).sort().reverse()}catch(e){}
    const models=[...new Set(["gemini-flash-latest",...dyn])].slice(0,5);
    let last="",done=false;
    for(let i=0;i<7&&!done;i++){
     const md=models[i%models.length];
     $("#busy").lastChild.textContent=" الذكاء الاصطناعي يقرأ المستند..."+(i?" (محاولة "+(i+1)+")":"");
     const res=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+md+":generateContent?key="+encodeURIComponent(key),{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({contents:[{parts:[{inline_data:{mime_type:"image/jpeg",data:b64}},{text:P}]}],generationConfig:{responseMimeType:"application/json"}})});
     const j=await res.json().catch(()=>({}));
     if(res.ok){t=((j.candidates||[])[0]?.content?.parts||[]).map(p=>p.text||"").join("");done=true;break}
     last=md+" — خطأ "+res.status+": "+((j.error&&j.error.message)||"غير معروف");
     if(res.status===404){continue}
     if(![429,500,503,504].includes(res.status))break;
     await new Promise(r=>setTimeout(r,1500*(i+1)));
    }
    if(!done){fail(last+" — أعد التصوير بعد دقيقة أو أدخل البيانات يدوياً");$("#busy").classList.add("hide");return}
   }
  }catch(e){fail("فشل الاتصال بالإنترنت أو تم حظر الطلب: "+e.message);$("#busy").classList.add("hide");return}
  const m=t.match(/\{[\s\S]*\}/);if(!m){fail("رد غير متوقع: "+t.slice(0,150));$("#busy").classList.add("hide");return}
  const r=JSON.parse(m[0]);
  $("#fName").value=r.voter_name||"";$("#fNum").value=String(r.voter_number||"").replace(/\s/g,"");$("#fEmp").value=r.employee_name||"";
  toast("تمت القراءة ✅ راجع البيانات");
 }catch(e){fail(e.message||String(e))}
 $("#busy").classList.add("hide");
}

/* ---------- ZIP / XLSX (بدون مكتبات خارجية) ---------- */
const CT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc=u=>{let c=~0;for(let i=0;i<u.length;i++)c=CT[(c^u[i])&255]^(c>>>8);return~c>>>0};
function zip(files){ // files:[{name,data:Uint8Array}] بدون ضغط
 const enc=new TextEncoder(),parts=[],cd=[];let off=0;
 for(const f of files){
  const nm=enc.encode(f.name),cr=crc(f.data),h=new DataView(new ArrayBuffer(30));
  h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint32(14,cr,true);h.setUint32(18,f.data.length,true);h.setUint32(22,f.data.length,true);h.setUint16(26,nm.length,true);
  parts.push(new Uint8Array(h.buffer),nm,f.data);
  const c=new DataView(new ArrayBuffer(46));
  c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint32(16,cr,true);c.setUint32(20,f.data.length,true);c.setUint32(24,f.data.length,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);
  cd.push(new Uint8Array(c.buffer),nm);off+=30+nm.length+f.data.length;
 }
 let cs=0;cd.forEach(p=>cs+=p.length);
 const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
 return new Blob([...parts,...cd,new Uint8Array(e.buffer)],{type:"application/zip"});
}
const esc=s=>String(s??"").replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));

 const X='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>',enc=new TextEncoder(),E=s=>enc.encode(s);
 const z=zip([
  {name:"[Content_Types].xml",data:E(X+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>')},
  {name:"_rels/.rels",data:E(X+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>')},
  {name:"xl/workbook.xml",data:E(X+'<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="الأرشيف" sheetId="1" r:id="rId1"/></sheets></workbook>')},
  {name:"xl/_rels/workbook.xml.rels",data:E(X+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>')},
  {name:"xl/worksheets/sheet1.xml",data:E(X+`<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView rightToLeft="1" workbookViewId="0"/></sheetViews><cols><col min="1" max="1" width="6" customWidth="1"/><col min="2" max="4" width="28" customWidth="1"/><col min="5" max="6" width="22" customWidth="1"/></cols><sheetData>${rows}</sheetData></worksheet>`)}
 ]);
 share(new Blob([z],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}),"ارشيف_الناخبين.xlsx");
